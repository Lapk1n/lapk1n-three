<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapk1n — three</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="/assets/logo.png" type="image/png">
</head>
<body>
    <button id="dashboardToggle" class="dashboard-toggle" type="button" aria-controls="dashboard" aria-expanded="true">
        <span class="dashboard-toggle__icon" aria-hidden="true">☰</span>
        <span class="dashboard-toggle__label">Menu</span>
    </button>
    <aside id="dashboard" class="dashboard" aria-label="Example dashboard">
        <button id="dashboardClose" class="dashboard-close" type="button" aria-label="Close dashboard">×</button>
        <div class="dashboard__header">
            <p class="eyebrow">Three.js journey</p>
            <h1>Dashboard</h1>
            <p class="dashboard__intro">Pick an experiment to load it into the canvas.</p>
        </div>
        <div id="scriptList" class="script-list"></div>
        <div class="dashboard__footer">
            <p id="scriptStatus" class="script-status" role="status">No example selected</p>
            <button id="clearScript" class="clear-button" type="button">Clear preview</button>
        </div>
    </aside>
    <main class="stage">
        <canvas class="webgl"></canvas>
        <div class="stage__hint">Select an example from the dashboard</div>
    </main>
    <script type="module" src="./dashboard.js"></script>
</body>
</html>
